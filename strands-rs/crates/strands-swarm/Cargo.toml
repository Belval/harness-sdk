[package]
name = "strands-swarm"
description = "Model-driven agent swarm on strands-harness: agents spawn, message and await each other; ratatui TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "strands-swarm"
path = "src/main.rs"

[dependencies]
strands-agents = { path = "../strands-agents", default-features = false, features = ["macros", "mcp"] }
strands-harness = { path = "../strands-harness" }
async-stream.workspace = true
async-trait.workspace = true
futures.workspace = true
indexmap.workspace = true
parking_lot = { workspace = true, features = ["deadlock_detection"] }
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }

[dev-dependencies]
strands-agents = { path = "../strands-agents", features = ["test-support"] }
tempfile.workspace = true
