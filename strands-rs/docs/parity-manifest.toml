# Parity manifest — strands-rs ⇔ strands-ts
#
# strands-rs is an idiomatic Rust port of the canonical TypeScript SDK
# (`strands-ts/`, in this same monorepo). This file maps each ported Rust source
# file to the strands-ts source it was derived from, and pins the monorepo commit
# the port was last reconciled against.
#
# `scripts/parity-check.sh` reads this file and reports strands-ts sources that
# changed upstream since their pinned commit, so the corresponding Rust files can
# be reviewed. See the "Maintaining parity" section of docs/PORTING.md.
#
# Fields per entry:
#   rust            - path (repo-relative) of the ported Rust file
#   ts_source       - path(s) of the strands-ts source (file or directory,
#                     repo-relative). Empty when the Rust file has no single
#                     strands-ts counterpart (Rust-only glue, or a construct drawn
#                     from the Python SDK that strands-ts does not have).
#   upstream_commit - monorepo commit the port was last reconciled against.
#   notes           - anything a reviewer needs when reconciling.
#
# To bump: after reconciling a Rust file with upstream, set its `upstream_commit`
# to the current monorepo HEAD.

pinned_default = "b63bb4f6d2694607907b19c04b7acf366ec091c9"

