[package]
name = "strands-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[dependencies]
strands-agents-macros = { version = "0.0.1", path = "../strands-macros", optional = true }

tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }

aws-config = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["macros", "bedrock"]
macros = ["strands-agents-macros"]
bedrock = ["aws-config", "aws-sdk-bedrockruntime", "aws-smithy-types"]
